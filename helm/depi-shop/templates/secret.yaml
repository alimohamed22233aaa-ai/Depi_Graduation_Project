{{- if and .Values.services.ordersservice.enabled (not .Values.ordersDb.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "depi.ordersSecretName" . }}
  labels:
    app.kubernetes.io/part-of: depi-shop
type: Opaque
stringData:
  DATABASE_URL: {{ required "ordersDb.url is required (postgresql+psycopg2://USER:PASS@<rds-endpoint>:5432/<db>) or set ordersDb.existingSecret" .Values.ordersDb.url | quote }}
{{- end }}
