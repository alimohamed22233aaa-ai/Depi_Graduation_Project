
image:
  registry: ""
  tag: ""               
  includeServiceInTag: false
  pullPolicy: IfNotPresent


ordersDb:
  existingSecret: ""    
  url: ""               
redis:
  address: ""          


ingress:
  enabled: true
  className: alb
  host: ""             
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

autoscaling:
  enabled: true
  targetCPUUtilizationPercentage: 70

defaultResources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 256Mi}

services:
  frontend:
    enabled: true
    port: 8080
    probe: {type: http, path: /_healthz, initialDelaySeconds: 5}
    hpa: {min: 2, max: 5}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 300m, memory: 256Mi}
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      SHOPPING_ASSISTANT_SERVICE_ADDR: unused:80   

  productcatalogservice:
    enabled: true
    port: 3550
    probe: {type: grpc}
    hpa: {min: 1, max: 3}
    env:
      PORT: "3550"
      DISABLE_PROFILER: "1"
      DISABLE_TRACING: "1"

  cartservice:
    enabled: true
    port: 7070
    usesRedis: true         
    probe: {type: grpc, initialDelaySeconds: 15}
    hpa: {min: 1, max: 3}

  checkoutservice:
    enabled: true
    port: 5050
    probe: {type: grpc}
    hpa: {min: 1, max: 3}
    env:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      ORDERS_SERVICE_ADDR: ordersservice:8080    
      DISABLE_PROFILER: "1"

  paymentservice:
    enabled: true
    port: 50051
    probe: {type: grpc}
    hpa: {min: 1, max: 3}
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  shippingservice:
    enabled: true
    port: 50051
    probe: {type: grpc}
    hpa: {min: 1, max: 3}
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"
      DISABLE_TRACING: "1"

  emailservice:
    enabled: true
    port: 8080
    probe: {type: grpc}
    hpa: {min: 1, max: 3}
    env:
      PORT: "8080"
      DISABLE_PROFILER: "1"
      DISABLE_TRACING: "1"

  currencyservice:
    enabled: true
    port: 7000
    probe: {type: grpc}
    hpa: {min: 1, max: 3}
    env:
      PORT: "7000"
      DISABLE_PROFILER: "1"
      DISABLE_TRACING: "1"

  recommendationservice:
    enabled: true
    port: 8080
    probe: {type: grpc}
    hpa: {min: 1, max: 3}
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      DISABLE_PROFILER: "1"
      DISABLE_TRACING: "1"

  adservice:
    enabled: true
    port: 9555
    probe: {type: grpc, initialDelaySeconds: 30}   # Java starts slowly
    hpa: {min: 1, max: 3}
    resources:
      requests: {cpu: 100m, memory: 200Mi}
      limits: {cpu: 500m, memory: 400Mi}
    env:
      PORT: "9555"
      DISABLE_STATS: "1"
      DISABLE_TRACING: "1"

  searchservice:
    enabled: true
    port: 8080
    probe: {type: http, path: /health}
    hpa: {min: 1, max: 3}
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"

  ordersservice:
    enabled: true
    usesOrdersDb: true
    port: 8080
    
    probe: {type: http, path: /health, initialDelaySeconds: 10}
    livenessType: tcp
    hpa: {min: 1, max: 3}
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"

  loadgenerator:           
    enabled: false
    port: 8089
    probe: {type: tcp}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
