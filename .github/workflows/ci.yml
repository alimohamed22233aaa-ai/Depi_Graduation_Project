name: CI Pipeline
on: 
    push:
        branches:
            - main
    pull_request:
        branches:
            - main        
jobs:
    python-test:
        defaults:
          run:
            working-directory: src/${{matrix.service}}
        
        
        strategy:
          fail-fast: false
          matrix:
            service: [searchservice, ordersservice,emailservice,recommendationservice]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4    
            
            - name: setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
            - name: install dependencies for python 
              run: |
                pip install -r requirements.txt
                pip install -r requirements-dev.txt     
            - name: run python tests
              run: python -m pytest -v --cov=. --cov-report=term-missing --cov-report=xml:coverage-python.xml
            - name: upload coverage report
              uses: actions/upload-artifact@v4
              with:
                name: coverage-${{ matrix.service }}
                path: src/${{ matrix.service }}/coverage-python.xml    
              
    GO-test:
        defaults:
          run:
            working-directory: src/${{matrix.service}}
        
        
        strategy:
          fail-fast: false
          matrix:
            service: [frontend,checkoutservice,productcatalogservice,shippingservice]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
             
            - name: setup GO
              uses: actions/setup-go@v7
              with:
                go-version-file: src/${{ matrix.service }}/go.mod
                cache-dependency-path: src/${{ matrix.service }}/go.sum

            - name: install dependencies for GO
              run: go mod download
            - name: run GO test
              run: go test -v -coverprofile=coverage-go.out  ./...                 

            - name: Show Go coverage summary
              if: always()  
              run: go tool cover -func=coverage-go.out 
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: coverage-${{ matrix.service }}
                path: src/${{ matrix.service }}/coverage-go.out     

    dotnet-test-cartservice:
        defaults:
          run:
            working-directory: src/cartservice
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4   

            - name: setup-dotnet
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '10.0.x'  
            
            - name: Install reportgenerator
              run: dotnet tool install --global dotnet-reportgenerator-globaltool
            - name: Run tests with coverage
              run: dotnet test ./tests --collect:"XPlat Code Coverage"

            - name: Generate HTML report
              run: |
               reportgenerator \
                "-reports:**/coverage.cobertura.xml" \
                "-targetdir:coverage-dotnet-report" \
                "-reporttypes:Html;TextSummary"
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: coverage-cartservice-dotnet
                path: src/cartservice/coverage-dotnet-report    




    nodejs-test:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:  
          service: [currencyservice,paymentservice]
      defaults:
        run:
          working-directory: src/${{matrix.service}}     
      
      steps:
            - name: Checkout
              uses: actions/checkout@v4 
            - name: setup nodejs
              uses: actions/setup-node@v7
              with:
   
                  node-version: '22'
            - name: install dependencies for nodejs
              run: npm ci 
            - name: run tests with coverage
              run: npm run test:coverage
            - name: fix lcov paths
              run: sed -i "s|^SF:|SF:src/${{ matrix.service }}/|" lcov.info  
            - name: upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: coverage-${{ matrix.service }}
                path: src/${{ matrix.service }}/lcov.info      
    java-test-adservice:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: src/adservice
      steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: setup java
            uses: actions/setup-java@v4
            with:
              java-version: '21'
              distribution: temurin
             

          - name: make gradlew executable
            run: chmod +x gradlew

          - name: build and run tests
            run: ./gradlew --no-daemon build -x verifyGoogleJavaFormat
          
          - name: upload coverage report
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: coverage-adservice
              path: src/adservice/build/reports/jacoco/test           
                
    Secret_scanning:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4   
              with:
                fetch-depth: 0
            - name: Scan for Secrets with Gitleaks
              uses: gitleaks/gitleaks-action@v3
              env:
                 GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    sonarqube-test:
      needs: [java-test-adservice,nodejs-test,dotnet-test-cartservice,python-test,GO-test]
      runs-on: ubuntu-latest
      steps:
        - name:  Checkout
          uses: actions/checkout@v7
          with:
        
            fetch-depth: 0


        - name: Download all coverage artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: coverage-*
            path: coverage-reports
    


        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@v6 
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
             
    

