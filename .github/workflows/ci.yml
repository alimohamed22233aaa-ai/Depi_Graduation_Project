name: CI Pipeline
on: 
    push:
        branches:
            - main
    pull_request:
        branches:
            - main        
jobs:
    python-test:
        defaults:
          run:
            working-directory: src/${{matrix.service}}
        
        
        strategy:
          fail-fast: false
          matrix:
            service: [searchservice, ordersservice]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4    
            
            - name: setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
            - name: install dependencies for python 
              run: |
                pip install -r requirements.txt
                pip install -r requirements-dev.txt     
            - name: run python tests
              run: python -m pytest -v --cov=. --cov-report=term-missing --cov-report=xml:python-coverage.xml
    
              
    GO-test:
        defaults:
          run:
            working-directory: src/${{matrix.service}}
        
        
        strategy:
          fail-fast: false
          matrix:
            service: [frontend,checkoutservice,productcatalogservice,shippingservice]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
             
            - name: setup GO
              uses: actions/setup-go@v7
              with:
                go-version: '1.25.0'

            - name: install dependencies for GO
              run: go mod download
            - name: run GO test
              run: go test -v -coverprofile=coverage-go.out  ./...                 

              